<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Ruang Baca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                Ruang Baca
            </a>

            <div class="navbar-nav ms-auto flex-row gap-2">
                <a class="nav-link text-white small" href="#">Beranda</a>
                <a class="nav-link text-white small" href="#">Tentang</a>
                <a class="nav-link text-white small" href="#">Bantuan</a>
            </div>
        </div>
    </nav>

    <main class="container-fluid bg-light min-vh-100 py-5">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">

                <div class="card border-0 shadow rounded-3">

                    <div class="card-body p-4">

                        <div class="text-center mb-4">
                            <h4 class="card-title mb-2">
                                Masuk ke Ruang Baca
                            </h4>

                            <p class="text-secondary small mb-0">
                                Temukan bacaan untuk hari ini.
                            </p>
                        </div>

                        <form>

                            <div class="mb-3">
                                <label for="username"
                                       class="form-label small">
                                    Username
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="username"
                                       placeholder="Masukkan username">
                            </div>

                            <div class="mb-3">
                                <label for="password"
                                       class="form-label small">
                                    Password
                                </label>

                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       placeholder="Masukkan password">
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input"
                                       type="checkbox"
                                       id="ingatSaya">

                                <label class="form-check-label small"
                                       for="ingatSaya">
                                    Ingat saya
                                </label>
                            </div>

                            <button type="submit"
                                    class="btn btn-success w-100">
                                Masuk
                            </button>

                        </form>
                    </div>

                    <div class="card-footer bg-light text-center py-3">
                        <a href="#"
                           class="text-success small">
                            Lupa password?
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
